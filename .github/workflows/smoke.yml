name: Smoke test

# Smoke test (e2e/smoke/) of a deployed site: every successful Vercel preview
# deployment, and production (or any URL) by hand. Read-only: the room flow
# (SMOKE_ROOMS) stays off here because it writes to the live Supabase.
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: Site to test
        default: https://bug-hunt-race.vercel.app
        required: true

permissions:
  contents: read

jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Preview')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The deployment's commit, so the puzzle fixes match the site.
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:smoke --base-url "$BASE_URL"
        env:
          BASE_URL: ${{ inputs.base_url || github.event.deployment_status.environment_url }}
          # Preview deployments sit behind Vercel Authentication.
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-playwright-report
          path: test-results/
          retention-days: 7
