name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm puzzles:check
      - run: pnpm build
      - run: pnpm bundle:check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fresh Postgres with every migration and the dev seed applied.
      - run: pnpm exec supabase db start
      - run: pnpm db:test
      - name: Generated types match the migrations
        run: pnpm db:types && git diff --exit-code lib/db/types.ts

  # Multi-player Realtime E2E (e2e/multiplayer/) against a local Supabase with
  # migrations and seed applied: database, auth, API and Realtime only. The
  # `ci` job skips these specs. No retries, so a flaky test fails the job.
  realtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec supabase start -x studio,storage-api,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor
      - name: Point the app at the local Supabase
        run: |
          pnpm exec supabase status -o json \
            | jq -r '"NEXT_PUBLIC_SUPABASE_URL=\(.API_URL)", "NEXT_PUBLIC_SUPABASE_ANON_KEY=\(.ANON_KEY)"' \
            >> "$GITHUB_ENV"
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e:multiplayer --retries=0
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: realtime-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
